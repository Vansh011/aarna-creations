services:
  - type: web
    name: aarna-creations
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OWNER_PIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: aarna-creations
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false
      - key: NEXT_PUBLIC_YOUTUBE_CHANNEL_ID
        sync: false
